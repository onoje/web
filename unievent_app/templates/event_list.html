<!DOCTYPE html>
<html>
<head>
    <title>UniEvent - Events</title>
</head>
<body>
    <h1>Events</h1>

    <form method="get" style="display: flex; gap: 10px; align-items: center; margin-bottom: 20px;">
        <input
            type="text"
            name="q"
            placeholder="Search events..."
            value="{{ query }}"
            style="height: 40px; padding: 0 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px;"
        >
        <select
            name="organization"
            style="height: 40px; padding: 0 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px;"
        >
            <option value="">All Organizations</option>
            {% for org in organizations %}
                <option value="{{ org.id }}" {% if selected_org == org.id %}selected{% endif %}>{{ org.name }}</option>
            {% endfor %}
        </select>

        <input
            type="submit"
            value="Filter"
            style="height: 40px; padding: 0 16px; font-size: 16px; border: 1px solid #aaa; border-radius: 5px; background-color: #eee; cursor: pointer;"
        >
    </form>

    <div style="display: flex; flex-wrap: wrap;">
        {% for event in events %}
            <div style="border: 1px solid #ccc; padding: 16px; width: 300px; min-height: 250px; margin: 10px; border-radius: 8px; background-color: #f9f9f9;">
                <h2>{{ event.title }}</h2>
                <p><b>Date:</b> {{ event.date }}</p>
                <p><b>Location:</b> {{ event.location }}</p>
                <p><b>Organizer:</b> {{ event.organizer.name }}</p>
                <p>{{ event.description }}</p>
            </div>
        {% empty %}
            <p>No events found.</p>
        {% endfor %}
    </div>

</body>
</html>
